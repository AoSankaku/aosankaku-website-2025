site-name: AoSankaku's Iroiro Blog
site-description: "あおさんかくが個人で運営している趣味サイトです。フロントエンド、サーバー、マインクラフトについて主に色々書いています。"

homepage:
  hidden-h1: AoSankaku's Iroiro Blog フロントエンド、サーバー、マインクラフト
  random-video: せっかく来たんだ、1曲どうだい？
  random-video-desc: 「もっと評価されるべき」と思っている曲を月替わりで上げています
  profile: 
    title: プロフィール
    name: あおさんかく
    subname: Blue Triangle
    basic-title: 基本情報
    nickname: 呼称：ぶるとら あおさんかく あおさん　等お好みでどうぞ
    gender: 性別：図形のため存在しない
    age: 年齢：お酒が飲める歳（強いとは言ってない）
    job: 職業：フロントエンドエンジニア その他いろいろ
    profile-pic: プロフィール画像：親友作（使用歴8年～）
  tech-stacks:
    title: 使ったことあるやつ
  details:
    website-title: サイト作りとか
    website-desc: このサイトも自分で1から錬成しました。Reactが好きですが、Next.jsもGatsbyもVikeも多言語対応がしんどいのでAstro使っています。
    dev-title: その他趣味開発
    dev-desc: 思いついたときに作りたいものを作っています。そういう人間です。諦めてください。
    english-title: 英語がﾁｮｯﾄできます
    english-desc: 英検1級取れてないのがコンプレックスです。モチベがありません。英語でVRChatをするのが夢です。
    hobby-title: 趣味が狭いです
    hobby-desc: 基本マイクラばっかりしてます。気が向いたときにアークナイツやコンパスとかやってたりします。
    casual-title: ダル絡み歓迎
    casual-desc: リアクションシューティング・いいね爆撃や頭を使わない会話も好きです。でも常識的な範囲でね。初対面なのにグイグイ来られるのは誰でも嫌だよ。
    music-title: 音楽の好み
    music-desc: 電子音、声を張ったボーカル、ギターが好きです。そういう曲を薦めると喜びます。アークナイツのOSTもよく聴きます。
  works:
    title: みてみてコーナー
    carousel:
      controls: スライド操作
      pause: 自動再生を一時停止
      play: 自動再生を再開
      go-to-slide: スライドを表示
    mirinkuyan:
      title: 我らが最大限に 尊敬し敬愛する みりんくゃん 御大同志将軍
      desc: 最近はカラオケを極めているらしいです。みんなで崇めましょう。
      link: 礼賛する
    moremobility:
      desc: 俺が作ったものではなく、sysnoteくゃんが作ってくれました。Automobilityを拡張するアドオンです。でっかい収穫機やネザライトエンジンなどを追加します。
      link: Modrinthで見る
    server:
      title: Create Citiesサーバー
      desc: マイクラサバもやってます。恐ろしい量のMODが工業を中心に入っています。友人限定ですが、知り合いの方で興味があれば広く参加を受け付けています。
    cpu:
      title: StreamDeck用CPUモニター
      desc: StreamDeckで、PartyParrotがCPU使用率を教えてくれるプラグインを作りました。ほぼバイブコーディングで作った初作品でもあります。
      link: ダウンロード（GitHub）
    passphrase-generator-japanese:
      title: 日本語パスフレーズ ジェネレーター
      desc: 「人間が覚えられるわけがない」でおなじみのパスワードですが、覚えやすいものが自動でできるWebアプリを作ってみました。
      link: 使ってみる
    station-sign:
      title: 駅名標ジェネレーター
      desc: 駅名標を簡単に作成できるWebアプリケーションを作成中です。だいぶ使える状態になってきました。まだベータなので、今後も機能追加をしていきます。
      link: 試してみる
    cpsresume:
      title: '#コンパス履歴書 ジェネレーター'
      desc: '#コンパス履歴書作るためにお絵かきアプリ開くのめんどくさいな～～～～～～～～～、という凄まじい熱意を持って作りました。'
      link: 作ってみる
    ultitype:
      title: UltiType
      desc: Monkeytypeとかいうクソサイトに一生登録できないので、自分でタイピング練習アプリを作っちゃいました。今後もガンガン拡張します。タイピング中上級者向けです。
      link: 遊んでみる
    craftsky:
      title: くらふとすきー
      desc: 「なんか作ってる人」が気軽に集まることができるようなMisskeyサーバーを作りました。お気軽に覗いてみてください。
      link: 見に行く
    icon:
      title: アイコンについて
      desc: 親友に描いてもらったものです。なんだかんだ8年以上愛用しています。ちなみにあおさんかくは普通に絵が下手です。

